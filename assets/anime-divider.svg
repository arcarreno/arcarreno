<svg xmlns="http://www.w3.org/2000/svg" width="960" height="44" viewBox="0 0 960 44" role="img" aria-label="Divisor decorativo: flor de sakura">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#7cc7ff" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#7cc7ff" stop-opacity="0.75"/>
      <stop offset="0.34" stop-color="#b79bff" stop-opacity="0.7"/>
      <stop offset="0.46" stop-color="#ff9dc6" stop-opacity="0.95"/>
      <stop offset="0.54" stop-color="#ff9dc6" stop-opacity="0.95"/>
      <stop offset="0.66" stop-color="#b79bff" stop-opacity="0.7"/>
      <stop offset="0.86" stop-color="#7cc7ff" stop-opacity="0.75"/>
      <stop offset="1"    stop-color="#7cc7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divPetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f9"/>
      <stop offset="1" stop-color="#ff7fb2"/>
    </linearGradient>
    <filter id="divGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <g id="divPetalShape">
      <path d="M0,9 C-4.2,4.6 -5,-1.6 -2.8,-5 C-1.4,-7 1.4,-7 2.8,-5 C5,-1.6 4.2,4.6 0,9 Z" fill="url(#divPetal)"/>
    </g>
    <g id="divLeaf">
      <path d="M0,0 C3,-3 7,-3 9,0 C7,3 3,3 0,0 Z" fill="#7cc7ff" opacity="0.75"/>
    </g>
  </defs>

  <!-- Línea principal -->
  <rect x="0" y="21.2" width="960" height="1.8" fill="url(#divLine)"/>

  <!-- Brillo central -->
  <ellipse cx="480" cy="22" rx="120" ry="10" fill="#ff9dc6" opacity="0.18" filter="url(#divGlow)"/>

  <!-- Hojas a los lados -->
  <g>
    <use href="#divLeaf" transform="translate(432,22) scale(-0.9,0.9)"/>
    <use href="#divLeaf" transform="translate(528,22) scale(0.9,0.9)"/>
  </g>

  <!-- Flor central de sakura -->
  <g transform="translate(480,22)">
    <g opacity="0.6" filter="url(#divGlow)">
      <use href="#divPetalShape" transform="rotate(0) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(72) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(144) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(216) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(288) scale(1.8)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="70s" repeatCount="indefinite"/>
      <use href="#divPetalShape" transform="rotate(0) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(72) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(144) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(216) scale(1.8)"/>
      <use href="#divPetalShape" transform="rotate(288) scale(1.8)"/>
    </g>
    <!-- estambres -->
    <g stroke="#ffd9a8" stroke-width="0.9" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="0" x2="0" y2="-5"/>
      <line x1="0" y1="0" x2="4" y2="-3"/>
      <line x1="0" y1="0" x2="-4" y2="-3"/>
      <line x1="0" y1="0" x2="2.5" y2="4"/>
      <line x1="0" y1="0" x2="-2.5" y2="4"/>
    </g>
    <circle r="2.8" fill="#ffe6a8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pétalos sueltos -->
  <g fill="#ffb3d4">
    <circle cx="418" cy="15" r="1.5" opacity="0.8">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="545" cy="29" r="1.3" opacity="0.8">
      <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="398" cy="30" r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0;0.9;0" dur="4.8s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="562" cy="14" r="1.4" opacity="0.7">
      <animate attributeName="opacity" values="0;0.9;0" dur="5.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
