<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Banner pixel art de Armando Carreño">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#141a3e"/>
      <stop offset="1" stop-color="#1f2a55"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5cc"/>
      <stop offset="0.5" stop-color="#7ce7ff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" fill="url(#sky)"/>

  <!-- Estrellas pixeleadas parpadeantes -->
  <g fill="#ffffff">
    <rect x="60" y="40" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="170" y="90" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="250" y="35" width="5" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="330" y="110" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="420" y="50" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="510" y="25" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="560" y="95" width="5" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="640" y="45" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="710" y="85" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="790" y="30" width="5" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="870" y="70" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="905" y="120" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Luna pixel (arriba-izquierda) -->
  <g shape-rendering="crispEdges">
    <rect x="70" y="58" width="14" height="14" fill="#ffc93c"/>
    <rect x="84" y="58" width="14" height="14" fill="#ffc93c"/>
    <rect x="98" y="58" width="14" height="14" fill="#ffc93c"/>
    <rect x="70" y="72" width="14" height="14" fill="#ffc93c"/>
    <rect x="84" y="72" width="14" height="14" fill="#ffdd55"/>
    <rect x="76" y="80" width="14" height="10" fill="#ffb52e"/>
    <rect x="90" y="80" width="14" height="10" fill="#ffb52e"/>
    <rect x="112" y="66" width="10" height="8" fill="#ffc93c"/>
    <rect x="122" y="70" width="10" height="8" fill="#ffc93c">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Colinas pixeladas -->
  <g shape-rendering="crispEdges">
    <rect x="0" y="250" width="960" height="20" fill="#1a2347"/>
    <rect x="0" y="262" width="780" height="16" fill="#16203e"/>
    <rect x="200" y="262" width="160" height="16" fill="#202b52"/>
    <rect x="470" y="262" width="140" height="16" fill="#202b52"/>
    <rect x="700" y="262" width="260" height="16" fill="#1b2547"/>
    <rect x="0" y="278" width="960" height="14" fill="#0e2f38"/>
    <rect x="120" y="278" width="180" height="14" fill="#14505e"/>
    <rect x="560" y="278" width="200" height="14" fill="#14505e"/>
    <rect x="820" y="278" width="140" height="14" fill="#14505e"/>
    <rect x="0" y="292" width="960" height="14" fill="#093a2b"/>
    <rect x="0" y="306" width="960" height="54" fill="#06271e"/>
  </g>

  <!-- Luces en la base -->
  <g fill="#53ff8a">
    <rect x="180" y="300" width="6" height="6"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="360" y="300" width="6" height="6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="640" y="300" width="6" height="6"><animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="820" y="302" width="6" height="6"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Robot pixel (izquierda, parpadea) -->
  <g>
    <rect x="120" y="150" width="6" height="20" fill="#8896c4"/>
    <circle cx="123" cy="145" r="4" fill="#ff5ca8"><animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite"/></circle>
    <rect x="96" y="170" width="54" height="40" rx="4" fill="#3b478c"/>
    <rect x="104" y="178" width="16" height="10" fill="#7ce7ff"><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="124" y="178" width="16" height="10" fill="#7ce7ff"><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="108" y="196" width="30" height="6" rx="3" fill="#ffc93c"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Texto central -->
  <text x="482" y="142" text-anchor="middle" font-family="'Courier New', monospace" font-size="52" font-weight="bold" fill="#0a0f24">
    <animate attributeName="opacity" values="0;1;1" dur="0.6s" fill="freeze" begin="0.2s"/>
    ARMANDO CARREÑO
  </text>
  <text x="480" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="52" font-weight="bold" fill="url(#nameGlow)">
    <animate attributeName="opacity" values="0;0.7;0.7" dur="0.6s" fill="freeze" begin="0.2s"/>
    ARMANDO CARREÑO
  </text>
  <text x="480" y="202" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" letter-spacing="3" fill="#9fd8ff">
    <tspan>INGENIERO EN CIENCIAS DE LA COMPUTACIÓN</tspan>
    <animate attributeName="opacity" values="0;1;1" dur="0.8s" fill="freeze" begin="0.6s"/>
  </text>

  <!-- Cursor de texto parpadeante -->
  <rect x="980" y="104" width="8" height="46" fill="#7ce7ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Nube pixel moviéndose -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="960,0; -120,0" dur="26s" repeatCount="indefinite"/>
    <rect x="0" y="158" width="20" height="12" fill="#2b3a70"/>
    <rect x="6" y="152" width="34" height="10" fill="#34457f"/>
    <rect x="20" y="144" width="30" height="10" fill="#34457f"/>
    <rect x="34" y="150" width="22" height="8" fill="#3f5390"/>
  </g>
</svg>