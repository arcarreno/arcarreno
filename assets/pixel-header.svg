<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Banner pixel art con bosque y cascada de Armando Carreño">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#141a3e"/>
      <stop offset="1" stop-color="#1c2a52"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5cc"/>
      <stop offset="0.5" stop-color="#7ce7ff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9eecff"/>
      <stop offset="1" stop-color="#3ec6e0"/>
    </linearGradient>

    <!-- Pino de la forest: centro en (0,0), copa a la arriba -->
    <g id="pine">
      <rect x="-3" y="-14" width="6" height="15" fill="#33261a"/>
      <rect x="-16" y="-9" width="34" height="7" fill="#17833f"/>
      <rect x="-13" y="-15" width="28" height="7" fill="#1b8f47"/>
      <rect x="-10" y="-21" width="22" height="7" fill="#209c50"/>
      <rect x="-7" y="-27" width="16" height="7" fill="#27ab5c"/>
      <rect x="-4" y="-33" width="10" height="7" fill="#2fb968"/>
    </g>
    <g id="pine-dark">
      <rect x="-3" y="-14" width="6" height="15" fill="#1f170e"/>
      <rect x="-20" y="-9" width="42" height="8" fill="#0c3f22"/>
      <rect x="-17" y="-16" width="36" height="8" fill="#0e4c28"/>
      <rect x="-14" y="-23" width="30" height="8" fill="#105830"/>
      <rect x="-11" y="-30" width="24" height="8" fill="#126438"/>
      <rect x="-8" y="-37" width="18" height="8" fill="#147040"/>
      <rect x="-5" y="-44" width="12" height="8" fill="#167c48"/>
    </g>
    <g id="mist">
      <rect x="0" y="0" width="10" height="4" fill="#bfefff" opacity="0.5"/>
    </g>
  </defs>

  <rect width="960" height="360" fill="url(#sky)"/>

  <!-- Estrellas parpadeantes -->
  <g fill="#ffffff">
    <rect x="60" y="30" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="170" y="70" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="250" y="25" width="5" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="360" y="90" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="440" y="45" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="520" y="28" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="600" y="80" width="5" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="680" y="38" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="770" y="66" width="5" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="860" y="34" width="5" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="915" y="95" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Sol pixel (arriba-izquierda) -->
  <g shape-rendering="crispEdges">
    <rect x="66" y="40" width="18" height="18" fill="#ffd166"/>
    <rect x="84" y="40" width="12" height="18" fill="#ffd166"/>
    <rect x="66" y="58" width="18" height="12" fill="#ffc84a"/>
    <rect x="84" y="58" width="12" height="12" fill="#ffb52e"/>
    <rect x="56" y="56" width="8" height="8" fill="#ffd166"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="100" y="50" width="8" height="8" fill="#ffd166"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Montañas lejanas -->
  <g shape-rendering="crispEdges">
    <rect x="0" y="212" width="960" height="14" fill="#16203e"/>
    <polygon points="0,212 120,168 240,212" fill="#17223f"/>
    <polygon points="820,212 920,160 960,212" fill="#16203e"/>
    <rect x="0" y="222" width="960" height="12" fill="#12354c"/>
  </g>

  <!-- Bosque trasero (pinos oscuros, perfil) -->
  <g>
    <use href="#pine-dark" transform="translate(60,300) scale(1.5)"/>
    <use href="#pine-dark" transform="translate(150,300) scale(1.3)"/>
    <use href="#pine-dark" transform="translate(230,300) scale(1.6)"/>
    <use href="#pine-dark" transform="translate(300,300) scale(1.35)"/>
    <use href="#pine-dark" transform="translate(700,300) scale(1.35)"/>
    <use href="#pine-dark" transform="translate(790,300) scale(1.6)"/>
    <use href="#pine-dark" transform="translate(880,300) scale(1.3)"/>
    <use href="#pine-dark" transform="translate(945,300) scale(1.5)"/>
  </g>

  <!-- Cascada -->
  <g>
    <rect x="434" y="196" width="12" height="140" fill="#2f3556"/>
    <rect x="536" y="196" width="12" height="140" fill="#2f3556"/>
    <rect x="446" y="196" width="90" height="140" fill="url(#water)"/>

    <!-- gotas cayendo -->
    <g fill="#bfefff">
      <rect x="452" y="200" width="4" height="16"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="470" y="200" width="4" height="16"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="0.9s" repeatCount="indefinite" begin="0.2s"/></rect>
      <rect x="488" y="200" width="4" height="16"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="1.1s" repeatCount="indefinite" begin="0.5s"/></rect>
      <rect x="506" y="200" width="4" height="16"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="0.95s" repeatCount="indefinite" begin="0.1s"/></rect>
      <rect x="524" y="200" width="4" height="14"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="1.05s" repeatCount="indefinite" begin="0.6s"/></rect>
    </g>
    <g fill="#7ce7ff">
      <rect x="462" y="200" width="3" height="12"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="0.85s" repeatCount="indefinite" begin="0.4s"/></rect>
      <rect x="497" y="200" width="3" height="12"><animateTransform attributeName="transform" type="translate" values="0,0;0,130" dur="1.15s" repeatCount="indefinite" begin="0.3s"/></rect>
    </g>

    <!-- Charco abajo -->
    <rect x="430" y="336" width="20" height="22" fill="#2b3557"/>
    <rect x="532" y="336" width="20" height="22" fill="#2b3557"/>
    <rect x="450" y="336" width="84" height="24" fill="#2fa7c4"/>
    <rect x="454" y="338" width="12" height="6" fill="#eafcff">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="340" width="12" height="6" fill="#eafcff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="506" y="338" width="12" height="6" fill="#eafcff">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- Bruma -->
    <g fill="#bfefff">
      <rect x="448" y="330" width="8" height="4" opacity="0.5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="466" y="336" width="8" height="4" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="520" y="332" width="8" height="4" opacity="0.5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Bosque frontal (pinos claros) -->
  <g>
    <use href="#pine" transform="translate(40,300) scale(1.7)"/>
    <use href="#pine" transform="translate(110,300) scale(1.5)"/>
    <use href="#pine" transform="translate(190,300) scale(1.9)"/>
    <use href="#pine" transform="translate(258,300) scale(1.6)"/>
    <use href="#pine" transform="translate(620,300) scale(1.6)"/>
    <use href="#pine" transform="translate(690,300) scale(1.9)"/>
    <use href="#pine" transform="translate(770,300) scale(1.5)"/>
    <use href="#pine" transform="translate(850,300) scale(1.7)"/>
    <use href="#pine" transform="translate(925,300) scale(1.4)"/>
  </g>

  <!-- Bruma de fondo arriba de la forest -->
  <g>
    <rect x="0" y="250" width="960" height="10" fill="#0b2c22" opacity="0.55"/>
  </g>

  <!-- Texto central -->
  <text x="482" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-size="50" font-weight="bold" fill="#0a0f24">
    <animate attributeName="opacity" values="0;1;1" dur="0.6s" fill="freeze" begin="0.2s"/>
    ARMANDO CARREÑO
  </text>
  <text x="480" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="50" font-weight="bold" fill="url(#nameGlow)">
    <animate attributeName="opacity" values="0;0.75;0.75" dur="0.6s" fill="freeze" begin="0.2s"/>
    ARMANDO CARREÑO
  </text>
  <text x="480" y="186" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" letter-spacing="3" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;1" dur="0.8s" fill="freeze" begin="0.6s"/>
    INGENIERO EN CIENCIAS DE LA COMPUTACIÓN
  </text>

  <!-- Cursor de texto parpadeante -->
  <rect x="815" y="102" width="8" height="38" fill="#7ce7ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>