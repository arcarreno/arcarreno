<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Banner pixel art 8-bit: atardecer en el pueblo de Armando Carreño">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181249"/>
      <stop offset="0.35" stop-color="#3a2a74"/>
      <stop offset="0.62" stop-color="#6f4398"/>
      <stop offset="0.85" stop-color="#a05b92"/>
      <stop offset="1" stop-color="#c06a85"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0c9"/>
      <stop offset="0.5" stop-color="#ffc98a"/>
      <stop offset="1" stop-color="#f08f4f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a70"/>
      <stop offset="1" stop-color="#2a1740"/>
    </linearGradient>

    <!-- Casa del pueblo -->
    <g id="house">
      <rect x="-4" y="-34" width="42" height="34" fill="#4a3366"/>
      <rect x="-4" y="-34" width="8" height="34" fill="#5b4278"/>
      <rect x="28" y="-34" width="10" height="34" fill="#392452"/>
      <polygon points="-14,-34 -14,-48 42,-48 38,-34" fill="#2c1d40"/>
      <polygon points="-14,-34 -14,-46 0,-46 -2,-34" fill="#3d2a58"/>
      <rect x="16" y="-50" width="6" height="14" fill="#241634"/>
      <rect x="16" y="-56" width="3" height="8" fill="#241634"/>
      <rect x="6" y="-36" width="9" height="11" fill="#ffb76e">
        <animate attributeName="opacity" values="0.7;1;0.75;1" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="26" y="-36" width="9" height="11" fill="#ffb76e">
        <animate attributeName="opacity" values="0.9;0.6;0.85;0.7" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Humo de chimenea -->
    <g id="puff">
      <rect x="-6" y="-4" width="12" height="7" fill="#d8c8cf">
        <animateTransform attributeName="transform" type="translate" values="0,0; -9,-70" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="width" values="12;18;24" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="7;10;12" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0.45;0" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Brillo del sol en el agua -->
    <g id="shine">
      <rect x="-60" y="0" width="120" height="3" fill="#ffd9a0">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Luciérnaga -->
    <g id="firefly">
      <rect x="-1" y="-1" width="3" height="3" fill="#ffd9a8">
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 5,-7; 0,0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </defs>

  <rect width="960" height="360" fill="url(#sky)"/>

  <!-- Estrellas tenues -->
  <g fill="#d9c6ef">
    <rect x="70" y="24" width="3" height="3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="170" y="50" width="2" height="2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="250" y="18" width="3" height="3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="360" y="56" width="2" height="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="440" y="28" width="3" height="3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="560" y="34" width="2" height="2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="880" y="40" width="3" height="3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Capas de nubes del atardecer (stratus) que se desplazan -->
  <g fill="#c87e9e">
    <rect x="0" y="188" width="320" height="10" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0,0; 40,0" dur="30s" repeatCount="indefinite"/></rect>
    <rect x="520" y="198" width="300" height="8" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0; -40,0" dur="34s" repeatCount="indefinite"/></rect>
    <rect x="120" y="212" width="260" height="9" opacity="0.45"><animateTransform attributeName="transform" type="translate" values="0,0; 34,0" dur="28s" repeatCount="indefinite"/></rect>
    <rect x="700" y="206" width="260" height="7" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0,0; -34,0" dur="32s" repeatCount="indefinite"/></rect>
  </g>

  <!-- SOL: halo + disco + rayos -->
  <g>
    <circle cx="560" cy="196" r="92" fill="#ffd9a0" opacity="0.10">
      <animate attributeName="opacity" values="0.06;0.16;0.06" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="196" r="64" fill="#ffdca6" opacity="0.16">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="5s" repeatCount="indefinite"/>
    </circle>
    <polygon points="560,96 560,196 600,180 600,88" fill="#ffd9a0" opacity="0.18"><animate attributeName="opacity" values="0.1;0.24;0.1" dur="4.5s" repeatCount="indefinite"/></polygon>
    <polygon points="500,140 560,196 520,236 440,180" fill="#ffd9a0" opacity="0.12"><animate attributeName="opacity" values="0.06;0.2;0.06" dur="5.2s" repeatCount="indefinite"/></polygon>
    <g>
      <rect x="530" y="164" width="18" height="18" fill="#ffca8c"/>
      <rect x="548" y="164" width="18" height="18" fill="#ffd9a0"/>
      <rect x="566" y="164" width="18" height="18" fill="#ffd9a0"/>
      <rect x="530" y="182" width="18" height="18" fill="#ffd9a0"/>
      <rect x="548" y="182" width="18" height="18" fill="#ffe6b3"/>
      <rect x="566" y="182" width="18" height="18" fill="#ffe6b3"/>
      <rect x="530" y="200" width="18" height="18" fill="#ffd9a0"/>
      <rect x="548" y="200" width="18" height="18" fill="#ffe0ae"/>
      <rect x="566" y="200" width="18" height="18" fill="#ffd9a0"/>
    </g>
  </g>

  <!-- Cordillera lejana (lavanda) -->
  <g>
    <polygon points="0,296 150,238 300,296" fill="#5b3f76"/>
    <polygon points="260,296 420,230 580,296" fill="#543c70"/>
    <polygon points="540,296 700,240 860,296" fill="#5b3f76"/>
    <polygon points="820,296 960,234 960,296" fill="#543c70"/>
    <polygon points="0,296 120,244 240,296" fill="#6b4a84"/>
    <polygon points="620,296 760,246 900,296" fill="#6b4a84"/>
  </g>

  <!-- MEDIA: pueblo en la cresta + humo -->
  <g>
    <rect x="0" y="282" width="960" height="20" fill="#2c1c48"/>
    <rect x="0" y="292" width="960" height="8" fill="#241638"/>

    <use href="#house" transform="translate(150,286)"/>
    <use href="#house" transform="translate(248,289)"/>
    <use href="#house" transform="translate(330,286)"/>
    <use href="#house" transform="translate(420,282) scale(1.2)"/>
    <use href="#house" transform="translate(470,283) scale(1.1)"/>
    <use href="#house" transform="translate(660,286)"/>
    <use href="#house" transform="translate(750,288)"/>
    <use href="#house" transform="translate(838,286)"/>

    <use href="#puff" transform="translate(322,234)"/>
    <use href="#puff" transform="translate(578,234)"/>
    <use href="#puff" transform="translate(778,234)"/>
  </g>

  <!-- CAMPOS en terrazas con reflejos del sol -->
  <g>
    <polygon points="0,300 960,300 960,360 0,360" fill="url(#field)"/>
    <rect x="0" y="312" width="960" height="4" fill="#6a4a86" opacity="0.5"/>
    <rect x="0" y="316" width="960" height="3" fill="#5a3f78"/>
    <rect x="0" y="334" width="960" height="4" fill="#6b4f8c" opacity="0.4"/>
    <rect x="0" y="348" width="960" height="3" fill="#583d78"/>

    <use href="#shine" transform="translate(560,312)"/>
    <use href="#shine" transform="translate(560,326)"/>
    <use href="#shine" transform="translate(560,340)"/>
    <use href="#shine" transform="translate(560,354)"/>
    <use href="#shine" transform="translate(470,318)"/>
    <use href="#shine" transform="translate(650,330)"/>
  </g>

  <!-- Siluetas al frente (hierba / juncos) -->
  <g fill="#1b0f2c">
    <path d="M0,360 L0,330 L14,344 L28,360 Z"/>
    <path d="M930,360 L930,330 L944,344 L958,330 L958,360 Z"/>
    <rect x="60" y="350" width="4" height="10"/>
    <rect x="70" y="352" width="4" height="8"/>
    <rect x="880" y="350" width="4" height="10"/>
  </g>

  <!-- Luciérnagas cálidas sobre el campo -->
  <g>
    <use href="#firefly" transform="translate(300,304)"/>
    <use href="#firefly" transform="translate(470,268)"/>
    <use href="#firefly" transform="translate(710,294)"/>
    <use href="#firefly" transform="translate(820,302)"/>
  </g>

  <!-- Texto central -->
  <text x="482" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#07040e">
    <animate attributeName="opacity" values="0;1;1" dur="0.6s" fill="freeze" begin="0.2s"/>
    ARMANDO CARREÑO
  </text>
  <text x="480" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="url(#nameGlow)">
    <animate attributeName="opacity" values="0;0.9;0.9" dur="0.6s" fill="freeze" begin="0.2s"/>
    ARMANDO CARREÑO
  </text>
  <text x="480" y="86" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;1" dur="0.8s" fill="freeze" begin="0.6s"/>
    INGENIERO EN CIENCIAS DE LA COMPUTACIÓN
  </text>

  <!-- Cursor de texto parpadeante -->
  <rect x="808" y="10" width="7" height="32" fill="#ffd9a0">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>