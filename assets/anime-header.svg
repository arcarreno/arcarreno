<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Banner estilo anime: cabaña junto a cascada entre árboles en un valle tranquilo">
  <defs>
    <!-- Cielo suave -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8ff"/>
      <stop offset="45%" stop-color="#e8f4ff"/>
      <stop offset="75%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Nubes -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f0ff"/>
    </linearGradient>
    <!-- Agua -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd3ff"/>
      <stop offset="100%" stop-color="#3fa9e8"/>
    </linearGradient>
    <!-- Humo cascada -->
    <radialGradient id="mistGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Bosque -->
    <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b6a3a"/>
      <stop offset="100%" stop-color="#1e4d2c"/>
    </linearGradient>
    <!-- Cabaña -->
    <linearGradient id="cabinWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8a06a"/>
      <stop offset="50%" stop-color="#b97a4a"/>
      <stop offset="100%" stop-color="#8c5636"/>
    </linearGradient>
    <linearGradient id="cabinRoof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d4c2f"/>
      <stop offset="100%" stop-color="#3e2a1a"/>
    </linearGradient>
    <!-- Texto -->
    <linearGradient id="nameGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a6a9a"/>
    </linearGradient>
    <!-- Filtro suave -->
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="1200" height="400" fill="url(#skyGrad)"/>
  <!-- Brillo solar -->
  <ellipse cx="950" cy="110" rx="180" ry="110" fill="#ffffff" opacity="0.18" filter="url(#soft)"/>

  <!-- Nubes estáticas -->
  <g fill="url(#cloudGrad)" opacity="0.9">
    <ellipse cx="200" cy="120" rx="110" ry="40"/>
    <ellipse cx="250" cy="100" rx="70" ry="28"/>
    <ellipse cx="170" cy="130" rx="60" ry="24"/>
    <ellipse cx="680" cy="90" rx="130" ry="48"/>
    <ellipse cx="740" cy="70" rx="80" ry="32"/>
    <ellipse cx="620" cy="110" rx="70" ry="26"/>
    <ellipse cx="980" cy="140" rx="100" ry="38"/>
    <ellipse cx="1050" cy="120" rx="60" ry="24"/>
  </g>

  <!-- Montañas lejanas -->
  <path d="M0,240 L0,260 Q120,210 260,230 Q400,250 540,220 Q680,190 820,230 Q960,260 1100,220 Q1200,200 1200,260 L1200,400 H0 Z" fill="#a8d0f0"/>
  <path d="M0,250 L0,260 Q130,230 270,245 Q410,260 550,235 Q690,210 830,245 Q970,275 1110,240 Q1200,220 1200,260 L1200,400 H0 Z" fill="#7ab6e6"/>
  <path d="M0,260 L0,260 Q140,250 280,260 Q420,270 560,250 Q700,230 840,260 Q980,285 1120,255 Q1200,240 1200,260 L1200,400 H0 Z" fill="#4a7ba6" opacity="0.6"/>

  <!-- Valle y bosque -->
  <!-- Colinas -->
  <path d="M0,260 C150,240 300,280 500,255 C700,230 900,270 1200,250 L1200,400 H0 Z" fill="url(#forestGrad)"/>
  <!-- Arboles grandes -->
  <g fill="#1e4d2c">
    <ellipse cx="80" cy="310" rx="45" ry="35"/>
    <ellipse cx="120" cy="300" rx="55" ry="42"/>
    <ellipse cx="160" cy="315" rx="38" ry="30"/>
    <ellipse cx="220" cy="295" rx="60" ry="46"/>
    <ellipse cx="280" cy="305" rx="48" ry="38"/>
    <ellipse cx="340" cy="300" rx="52" ry="40"/>
    <ellipse cx="400" cy="310" rx="44" ry="34"/>
    <ellipse cx="460" cy="295" rx="50" ry="38"/>
    <ellipse cx="520" cy="305" rx="46" ry="36"/>
    <ellipse cx="580" cy="295" rx="58" ry="44"/>
    <ellipse cx="640" cy="300" rx="50" ry="40"/>
    <ellipse cx="700" cy="295" rx="54" ry="42"/>
    <ellipse cx="760" cy="305" rx="48" ry="36"/>
    <ellipse cx="820" cy="300" rx="52" ry="40"/>
    <ellipse cx="880" cy="295" rx="46" ry="34"/>
    <ellipse cx="940" cy="300" rx="50" ry="38"/>
    <ellipse cx="1000" cy="295" rx="44" ry="34"/>
    <ellipse cx="1080" cy="305" rx="48" ry="38"/>
    <ellipse cx="1150" cy="300" rx="42" ry="32"/>
  </g>
  <!-- Troncos -->
  <g fill="#3b2f2f">
    <rect x="75" y="330" width="10" height="70"/>
    <rect x="115" y="325" width="12" height="75"/>
    <rect x="155" y="330" width="10" height="70"/>
    <rect x="210" y="320" width="14" height="80"/>
    <rect x="270" y="325" width="12" height="75"/>
    <rect x="330" y="320" width="12" height="80"/>
    <rect x="390" y="330" width="10" height="70"/>
    <rect x="450" y="320" width="12" height="80"/>
    <rect x="510" y="325" width="10" height="75"/>
    <rect x="570" y="320" width="14" height="80"/>
    <rect x="630" y="325" width="12" height="75"/>
    <rect x="690" y="320" width="12" height="80"/>
    <rect x="750" y="325" width="10" height="75"/>
    <rect x="810" y="320" width="12" height="80"/>
    <rect x="870" y="325" width="10" height="75"/>
    <rect x="930" y="320" width="12" height="80"/>
    <rect x="990" y="325" width="10" height="75"/>
    <rect x="1070" y="320" width="12" height="80"/>
    <rect x="1140" y="325" width="10" height="75"/>
  </g>

  <!-- Río y cascada -->
  <!-- Río principal -->
  <path d="M-100,340 C200,360 400,320 650,340 C900,360 1100,330 1300,350 L1300,400 H-100 Z" fill="url(#waterGrad)"/>
  <!-- Cascada -->
  <path d="M860,200 L900,200 L920,260 L880,260 Z" fill="#6eb7e8"/>
  <path d="M920,260 L920,350 L860,350 Z" fill="url(#waterGrad)"/>
  <!-- Salpicaduras -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="890" cy="250" rx="18" ry="8"/>
    <ellipse cx="905" cy="245" rx="12" ry="6"/>
    <ellipse cx="875" cy="255" rx="10" ry="5"/>
  </g>
  <!-- Niebla cascada -->
  <ellipse cx="890" cy="300" rx="70" ry="45" fill="url(#mistGrad)"/>

  <!-- Cabaña -->
  <g transform="translate(180,280)">
    <!-- Base -->
    <rect x="-40" y="40" width="120" height="80" rx="6" fill="#d9c5a8" opacity="0.2"/>
    <!-- Piso -->
    <rect x="-35" y="70" width="110" height="40" fill="url(#cabinWood)"/>
    <!-- Paredes -->
    <rect x="-30" y="30" width="100" height="40" fill="#f2e8d9"/>
    <!-- Techo -->
    <polygon points="-45,30 0,0 85,30 70,70 -30,70" fill="url(#cabinRoof)"/>
    <!-- Chimenea -->
    <rect x="55" y="-20" width="12" height="28" fill="#5a4331"/>
    <rect x="50" y="-30" width="22" height="12" fill="#3e2a1a"/>
    <!-- Ventanas -->
    <rect x="-18" y="38" width="22" height="18" fill="#cfe8ff" stroke="#2a6a9a" stroke-width="1.5"/>
    <rect x="22" y="38" width="22" height="18" fill="#cfe8ff" stroke="#2a6a9a" stroke-width="1.5"/>
    <!-- Puerta -->
    <rect x="38" y="70" width="24" height="38" fill="#8c5636" stroke="#5a3a24" stroke-width="1"/>
    <!-- Humo -->
    <g fill="#ffffff" opacity="0.6">
      <ellipse cx="60" cy="-45" rx="14" ry="8"/>
      <ellipse cx="68" cy="-62" rx="10" ry="6"/>
    </g>
  </g>

  <!-- Camino -->
  <path d="M40,340 C160,335 240,350 340,338" fill="none" stroke="#e8dccb" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <path d="M40,340 C160,335 240,350 340,338" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Aves pequeñas -->
  <g fill="#2a4a6a">
    <path d="M1000,130 Q1015,120 1030,130"/>
    <path d="M1040,150 Q1055,140 1070,150"/>
  </g>

  <!-- Texto -->
  <g text-anchor="middle" font-family="'Segoe UI Semibold','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="600" y="80" font-size="44" font-weight="700" letter-spacing="6" fill="#1e3a5f">ARMANDO CARREÑO</text>
    <text x="600" y="115" font-size="14" font-weight="600" letter-spacing="3" fill="#2a6a9a">INGENIERO EN CIENCIAS DE LA COMPUTACIÓN</text>
    <text x="600" y="135" font-size="11" font-weight="400" letter-spacing="2.5" fill="#5a7a9a">PUEBLA, MÉXICO</text>
  </g>

  <!-- Marco sutil -->
  <rect x="8" y="8" width="1184" height="384" rx="18" fill="none" stroke="#e6f2ff" stroke-width="1.5" opacity="0.6"/>
</svg>
